name: pages

# Builds the live demo and publishes it to GitHub Pages.
# The demo is rendered by the package itself, so it always matches main.
# The weekly run picks up changes in dependencies.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl
          coverage: none

      - name: Use the core from GitHub until it is on Packagist
        run: composer config repositories.core vcs https://github.com/Ruvelo/security-advisories

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Build the demo
        run: php demo/build.php build/site

      - name: Add the images
        run: cp -r art build/site/art

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
